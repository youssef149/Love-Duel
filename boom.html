<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOM Duel - تحدي القلوب</title>
    <!-- مكتبات الاتصال والرسوم -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* التنسيقات الأساسية للملعب */
        body { background: #120718; color: #fce7f3; margin: 0; padding: 20px; font-family: sans-serif; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; }
        .screen { display: none; background: rgba(30, 15, 35, 0.95); padding: 25px; border-radius: 20px; border: 2px solid #701a75; text-align: center; }
        .screen.active { display: block; }
        
        button { background: #ff2a85; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; margin: 10px 0; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #701a75; background: #000; color: white; text-align: center; margin: 10px 0; }
        
        .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .cell-btn { aspect-ratio: 1; background: #2d1235; border: 2px solid #701a75; border-radius: 12px; font-size: 2rem; cursor: pointer; }
        .cell-btn.selected { background: #ff2a85; border-color: #fff; }
        
        #boom-effect-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. الشاشة الرئيسية -->
        <div id="screen-home" class="screen active">
            <h1>💣 BOOM Duel</h1>
            <button onclick="createRoom()">إنشاء غرفة جديدة</button>
            <button onclick="showJoinScreen()">انضمام لغرفة</button>
            <button onclick="window.location.href='index.html'" style="background:#4a044e;">العودة للرئيسية</button>
        </div>

        <!-- 2. شاشة الانضمام -->
        <div id="screen-join" class="screen">
            <h2>انضمام</h2>
            <input type="text" id="join-code" placeholder="أدخل كود الغرفة">
            <button onclick="joinRoom()">دخول</button>
            <button onclick="showHome()" style="background:transparent;">رجوع</button>
        </div>

        <!-- 3. شاشة التجهيز -->
        <div id="screen-setup" class="screen">
            <h3>اختر 3 قلوب سرية</h3>
            <div id="setup-grid" class="board-grid"></div>
            <input type="text" id="secret-word" placeholder="كلمة سرية">
            <button onclick="lockSetup()">تأكيد وبدء</button>
        </div>

        <!-- 4. شاشة اللعب -->
        <div id="screen-game" class="screen">
            <h3 id="turn-status">انتظر...</h3>
            <div id="game-grid" class="board-grid"></div>
        </div>

        <!-- 5. تأثيرات (بووم/سيف) -->
        <div id="boom-effect-overlay" class="screen" style="display:none;">
            <h1 id="effect-title"></h1>
            <p id="effect-desc"></p>
        </div>
    </div>

    <script src="boom.js"></script>
</body>
</html>
