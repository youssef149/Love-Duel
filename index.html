<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveDuel - الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1f1025, #2d1235, #120718);
            --card-bg: rgba(30, 15, 35, 0.95);
            --primary-pink: #db2777;
            --accent-purple: #9333ea;
            --text-main: #fce7f3;
            --text-muted: #d946ef;
            --border-color: #701a75;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(176, 65, 255, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .app-container { width: 100%; max-width: 500px; }
        
        h1 { text-align: center; color: #ff2a85; font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; font-weight: 600; }

        /* شبكة عرض اللعبتين جنب بعض زي الصورة */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        .game-card {
            background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius);
            padding: 15px 10px; text-align: center; box-shadow: var(--shadow); position: relative;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .game-card:hover { transform: translateY(-3px); border-color: #ff2a85; }

        .card-img-box {
            width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden;
            border: 2px solid var(--border-color); margin-bottom: 12px; background: #000;
            display: flex; align-items: center; justify-content: center; font-size: 3rem;
        }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }

        .game-title { font-size: 1rem; font-weight: bold; color: #fff; margin-bottom: 12px; }

        .play-btn {
            background: #fff; color: #000; width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; cursor: pointer; transition: 0.2s;
        }
        .play-btn:hover { background: #ff2a85; color: #fff; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>LoveDuel ❤️</h1>
        <p class="subtitle">اختر لعبة التحدي المفضلة لديك</p>

        <div class="games-grid">
            <!-- اللعبة الأولى: حجر ورقة مقص / 1 ضد 1 -->
            <div class="game-card" onclick="window.location.href='index_game.html'">
                <div class="card-img-box">
                    <i class="fa-solid fa-hand-fist" style="color: #ff2a85;"></i>
                </div>
                <div class="game-title">واحد ضد واحد</div>
                <button class="play-btn"><i class="fa-solid fa-play"></i></button>
            </div>

            <!-- اللعبة الثانية: BOOM -->
            <div class="game-card" onclick="window.location.href='boom.html'">
                <div class="card-img-box">
                    <i class="fa-solid fa-bomb" style="color: #b041ff;"></i>
                </div>
                <div class="game-title">تحدي BOOM 💣</div>
                <button class="play-btn"><i class="fa-solid fa-play"></i></button>
            </div>
        </div>
    </div>

</body>
</html>
